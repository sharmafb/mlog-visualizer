server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name fb.mvfst.net;

    ssl_certificate /etc/letsencrypt/live/fb.mvfst.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fb.mvfst.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; worker-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'none'" always;

    location = / { return 302 /mlog/; }
    location = /mlog { return 301 /mlog/; }
    location /mlog/ {
        alias /srv/mlog-visualizer/current/;
        index index.html;
        limit_except GET { deny all; }
    }
}
